<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Forecasting</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#202123;font:15px system-ui,sans-serif}main{max-width:1140px;margin:64px auto;padding:0 28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:44px}h1{font-size:30px;letter-spacing:-1px;font-weight:600;margin:0}h2{font-size:17px;font-weight:600;margin:0 0 18px}a{color:inherit}section{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid section{margin:0}textarea{width:100%;height:340px;border:1px solid #ddd;border-radius:8px;padding:14px;font:12px ui-monospace,monospace;resize:vertical}button{background:#222;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin-top:14px}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee}th{color:#666;font-weight:500}.run{color:#126d59;text-decoration:underline;cursor:pointer;background:none;padding:0;margin:0;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;max-height:380px;overflow:auto}#message{min-height:22px;margin:10px 0;color:#666}#counts{color:#666;font-size:13px}#chart{width:100%;height:120px}footer{color:#888;font-size:12px;margin-top:28px}@media(max-width:750px){.grid{grid-template-columns:1fr}main{margin-top:30px}td:first-child{max-width:120px;overflow-wrap:anywhere}}
</style>
<main><header><h1>Price Forecasting</h1><a href="/docs">API</a></header>
<div id="counts"></div>
<section><h2>Models</h2><div id="models">Loading…</div></section>
<div class="grid"><section><h2>New forecast</h2><textarea id="request" aria-label="Forecast request JSON" spellcheck="false"></textarea><button id="submit">Run forecast</button><p id="message" role="status"></p></section>
<section><h2>Result</h2><svg id="chart" viewBox="0 0 500 120" role="img" aria-label="Selected forecast values"></svg><pre id="result">Select a run to view its result.</pre></section></div>
<section><h2>Runs</h2><table><thead><tr><th>Run</th><th>Model</th><th>Status</th></tr></thead><tbody id="runs"></tbody></table></section>
<footer>Reference deployment · run the worker separately to process forecasts.</footer></main>
<script>
const $=id=>document.getElementById(id);
const sample={model_id:'seasonal-naive',model_version:'1.0.0',idempotency_key:'console-'+crypto.randomUUID(),inputs:{series:{market:'DEMO',market_type:'DA',location:'HUB',market_timezone:'UTC'},as_of:'2026-01-01T01:00:00Z',target_times:['2026-01-01T02:00:00Z','2026-01-01T03:00:00Z'],history:[{timestamp:'2026-01-01T00:00:00Z',available_at:'2026-01-01T00:05:00Z',price:-5},{timestamp:'2026-01-01T01:00:00Z',available_at:'2026-01-01T01:00:00Z',price:30}]}};
$('request').value=JSON.stringify(sample,null,2);
let selected=null;
async function api(path,options){const r=await fetch(path,options);const body=await r.json();if(!r.ok)throw new Error(JSON.stringify(body.detail??body));return body}
function result(run){$('result').textContent=JSON.stringify(run,null,2);$('chart').replaceChildren();const ps=run.result?.prediction.points;if(!ps?.length)return;const values=ps.map(p=>p.value),lo=Math.min(...values),hi=Math.max(...values);const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',values.map((v,i)=>`${20+460*i/Math.max(1,values.length-1)},${100-80*(v-lo)/(hi-lo||1)}`).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#16816a');line.setAttribute('stroke-width','2');$('chart').append(line);const label=document.createElementNS('http://www.w3.org/2000/svg','text');label.setAttribute('x','20');label.setAttribute('y','15');label.setAttribute('font-size','11');label.textContent=`${lo} – ${hi} ${run.result.series.currency}/MWh`; $('chart').append(label)}
async function refresh(){try{const [models,runs,status]=await Promise.all([api('/models'),api('/forecasts?limit=25'),api('/status')]);$('models').textContent=models.length?models.map(m=>`${m.model_id} / ${m.version}${m.status?' · '+m.status:''}`).join('   ·   '):'No models registered.';$('counts').textContent=Object.entries(status.runs).map(([k,v])=>`${v} ${k}`).join('   ·   ');$('runs').replaceChildren();for(const run of runs){const tr=document.createElement('tr');const cell=document.createElement('td');const btn=document.createElement('button');btn.className='run';btn.textContent=run.run_id.slice(0,8);btn.onclick=()=>{selected=run.run_id;result(run)};cell.append(btn);tr.append(cell);for(const value of [`${run.model_id} / ${run.model_version}`,run.status]){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('runs').append(tr);if(run.run_id===selected)result(run)}}catch(e){$('message').textContent=e.message}}
$('submit').onclick=async()=>{const button=$('submit');button.disabled=true;try{const payload=JSON.parse($('request').value);const run=await api('/forecasts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});selected=run.run_id;$('message').textContent='Queued · '+run.run_id;result(run);payload.idempotency_key='console-'+crypto.randomUUID();$('request').value=JSON.stringify(payload,null,2);await refresh()}catch(e){$('message').textContent=e.message}finally{button.disabled=false}};
refresh();setInterval(refresh,3000);
</script></html>
